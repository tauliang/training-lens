name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python tools/generate_dashboards.py && git diff --exit-code -- build/training_lens/default/data/ui build/training_lens/default/savedsearches.conf
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: training-lens-python-${{ matrix.python }}
          path: dist/*

  appinspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install splunk-appinspect==4.3.1
      - run: python tools/generate_dashboards.py && python tools/package.py
      - run: splunk-appinspect inspect dist/training_lens-1.0.0.spl --mode precert --output-file appinspect-ci.json
      - name: Require zero errors, failures and future failures
        run: |
          python - <<'PYTHON'
          import json
          result = json.load(open('appinspect-ci.json'))['summary']
          assert all(result[k] == 0 for k in ('error', 'failure', 'future_failure')), result
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appinspect-report
          path: appinspect-ci.json
