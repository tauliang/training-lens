[tl_active]
definition = search index=training_lens sourcetype=training_lens:ready earliest=0 latest=+10y | sort 0 - import_epoch | head 1 | stats count AS selection_count first(snapshot_id) AS snapshot_id | eval snapshot_id=coalesce(snapshot_id,"__none__") | fields snapshot_id
iseval = 0

[tl_activities]
definition = index=training_lens sourcetype=training_lens:activity earliest=0 latest=+10y [ `tl_active` ] | dedup event_id
iseval = 0

[tl_samples]
definition = index=training_lens sourcetype=training_lens:sample earliest=0 latest=+10y [ search index=training_lens sourcetype=training_lens:membership earliest=0 latest=+10y [ `tl_active` ] | dedup stream_revision_id | appendpipe [ stats count | where count=0 | eval stream_revision_id="__none__" ] | fields stream_revision_id ] | dedup event_id
iseval = 0

[tl_reconciliation]
definition = index=training_lens OR index=training_lens_private OR index=training_lens_shared earliest=0 latest=+10y | where in(kind,"social","activity","sample","lap","zone","split","best_effort","exercise","gear_threshold","goal","gps","geography","snapshot","membership") | eval group_key=if(in(kind,"social","activity","exercise","gear_threshold","goal","snapshot"),snapshot_id,stream_revision_id) | stats dc(eval(if(in(kind,"snapshot","membership"),null(),event_id))) AS actual max(expected_records) AS expected values(snapshot_id) AS snapshots max(expected_groups) AS expected_groups max(eval(if(kind="snapshot",import_epoch,null()))) AS import_epoch BY group_key | eval matched=if(isnotnull(expected) AND actual=expected,1,0) | mvexpand snapshots | stats count AS groups sum(matched) AS matched max(expected_groups) AS expected_groups max(import_epoch) AS import_epoch BY snapshots | rename snapshots AS snapshot_id
iseval = 0

[tl_reconcile]
definition = `tl_reconciliation` | where groups=expected_groups AND matched=groups
iseval = 0
