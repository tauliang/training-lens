[Training Lens reconcile imports]
search = `tl_reconcile` | search NOT [ search index=strava sourcetype=training_lens:ready earliest=0 latest=+10y | fields snapshot_id ] | eval _time=now(), kind="ready" | collect index=strava sourcetype=training_lens:ready
cron_schedule = * * * * *
