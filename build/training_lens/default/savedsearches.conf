[Training Lens reconcile imports]
search = `tl_reconcile` | search NOT [ search index=training_lens_ops sourcetype=training_lens:ready earliest=0 latest=+10y | fields snapshot_id ] | eval _time=now(), kind="ready" | collect index=training_lens_ops sourcetype=training_lens:ready
is_scheduled = 1
cron_schedule = * * * * *
dispatch.earliest_time = 0
dispatch.latest_time = +10y
enableSched = 1
schedule_window = auto
